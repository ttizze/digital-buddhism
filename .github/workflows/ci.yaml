name: Deploy read model v2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-migration
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    defaults:
      run:
        shell: nix develop --command bash -e {0}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: '22'
          cache: true
      - run: vp install
      - name: Verify production target and preserve previous deployment ID
        run: bun scripts/deploy-read-model-v2.ts preflight
      - name: Validate application
        run: |
          bun run typecheck
          bun run format:check
          bun run lint
          bun run test --run
          bun run build
      - name: Apply production migrations
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: bun scripts/turso-migrations.ts
      - name: Generate v2 KV from current production snapshot
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: bun scripts/deploy-read-model-v2.ts publish
      - name: Deploy Worker after all v2 snapshots exist
        run: bunx wrangler deploy
      - name: Verify live home and article
        run: |
          curl --fail --silent --show-error "$VITE_PUBLIC_DOMAIN/en/tipitaka" -o /tmp/live-home.html
          curl --fail --silent --show-error "$VITE_PUBLIC_DOMAIN/ja/tipitaka/tipitaka-01-tipitaka-mula-01-sutta-pitaka" -o /tmp/live-article.html
          python3 - <<'PY'
          from pathlib import Path
          home=Path('/tmp/live-home.html').read_text()
          article=Path('/tmp/live-article.html').read_text()
          assert 'Tipiṭaka' in home
          assert '<article' in article and 'Sutta Pitaka' in article
          print('Live home and Sutta Pitaka article returned complete HTML.')
          PY
