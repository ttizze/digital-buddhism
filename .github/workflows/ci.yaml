name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 'latest'

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile

      - name: Run Biome
        run: |
          bun x biome ci .

      - name: Run typecheck
        run: |
          bun run typecheck

      - name: Run tests
        env:
          TZ: 'Asia/Tokyo'
        run: |
          bunx vitest run
