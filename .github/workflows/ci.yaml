name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: '22'
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - name: Check with Vite+
        run: vp run check:ci

      - name: Run tests with Vite+
        env:
          TZ: 'Asia/Tokyo'
        run: vp run test:ci

      - name: Build with Vite+
        env:
          WORKERS_CI_BRANCH: ci
        run: vp run build:ci

      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

  migrate-production:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: ci-check
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-migration
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: '22'
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Migrate production database
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: vp run db:prod:migrate
